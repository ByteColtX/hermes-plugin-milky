schema: spec-driven

context: |
  这是 Hermes 的 Milky QQ directory plugin；根目录 `__init__.py::register(ctx)` 是唯一公开入口。
  `ARCHITECTURE.md` 维护稳定模块边界、生命周期和所有权；`README.md` 维护安装、配置和当前能力；
  源码、测试与 evidence 才能证明实现状态。未归档 change 只是规划，不得将目标或未验证能力写成已交付。
  OpenSpec artifacts 使用中文并描述可观察行为，不写具体类名、函数名、库选择或逐行实现方案。
  注册和导入阶段不得联网、建立 SSE 或创建长期任务；普通消息入口须在必要的连接状态同步完成后开放，
  停止时必须取消并等待插件任务并释放插件拥有的资源。
  Milky v1.3 使用 HTTP POST Action 和 SSE GET `/event`；普通 Agent 流程只处理 `message_receive`，
  并沿既有 canonical、去重、确定性 Gate、独立 Will 和 Hermes handoff 边界运行；同一 chat 按 ingress
  顺序串行处理。只接受已确认的 `dm:<十进制 QQ 号>` 和 `group:<十进制群号>` 目标；非法或 temp
  目标不得回退到其他目标或创建普通会话。
  入站资源的下载、缓存、SSRF、权限和本地路径由 Hermes 公共 helper 负责；出站本地资源遵守项目既有
  大小限制和一次性读取边界。工具只来自 manifest、`outbound/tools.py` 和显式 operationId，不开放
  任意 Action catalog，也不由正文、关键词、Will 或事件隐式触发状态变更。
  可能产生副作用的 Action 最多调用一次；未确认能力保持 `unknown`、`malformed`、`blocked` 或
  `unsupported`，不得报告假成功或盲目重试。
  规范、fixture、快照和提交只使用合成身份、协议值和占位资源。运行时诊断可在确有运维关联时保留
  已确认的 chat key、message ID 或必要的群/用户 ID，但不得记录 token、Authorization、原始响应或
  异常正文、敏感消息正文、媒体 URL、本地路径、文件内容、Tool 原始参数或原始结果。

rules:
  proposal:
    - 说明相对于当前实现和主 specs 的差异、范围、非目标与证据状态，不把规划或未验证能力写成已交付。
  specs:
    - 只写可观察行为和已确认的项目边界；遵守既有生命周期、消息/媒体所有权、授权、日志和隐私边界。
    - 不复制 ARCHITECTURE.md 或主 specs 的精确顺序、字段、默认值，也不猜测未确认的协议或 Hermes API。
  design:
    - 说明依赖方向、资源与状态所有权、实现状态、未决问题和验证边界；未确认能力保持明确的 unknown 或 unsupported 状态。
  tasks:
    - 为任务写明验证方式，并区分 fixture/fake host 证据与真实 Hermes/Milky 验证；未完成的边界不得写成已验证。
