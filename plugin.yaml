name: hermes-plugin-milky
label: Milky QQ
kind: platform
version: 1.2.0
manifest_version: 2
python_dependencies:
  - "httpx>=0.27,<1"
description: >-
  将 Milky QQ 的 HTTP Action 和 SSE `/event` 接入 Hermes Gateway：接收
  friend/group 的 `message_receive`，完成规范化、去重、Gate、Will 和 Agent 交接；
  出站支持文本、CQ-compatible `at`/`reply`、原生媒体、独立文件上传以及
  系统/cron home channel。同时注册只读 `/milky` 命令和 25 个显式 QQ ToolSpec。
  temp 会话及非消息事件不会进入普通 Agent 流程；入站媒体下载、缓存和 SSRF
  边界由 Hermes 负责，出站本地附件由插件执行受限 materialization。
author: ByteColtX
provides_tools:
  - send_profile_like
  - send_friend_nudge
  - send_group_nudge
  - recall_group_message
  - get_group_info
  - get_group_member_list
  - get_group_member_info
  - set_group_member_mute
  - set_group_whole_mute
  - get_forwarded_messages
  - get_private_file_download_url
  - kick_group_member
  - quit_group
  - delete_friend
  - get_friend_requests
  - accept_friend_request
  - reject_friend_request
  - get_group_file_download_url
  - accept_group_request
  - reject_group_request
  - accept_group_invitation
  - reject_group_invitation
  - get_group_files
  - get_friend_info
  - set_group_member_special_title
requires_env:
  - name: MILKY_BASE_URL
    description: >-
      Milky HTTP(S) 服务基址，例如 `http://127.0.0.1:3000`；保留 path prefix，
      Action 使用 `<base>/api/{action}`，SSE 使用 `<base>/event`。
    prompt: Milky 服务地址
    password: false
  - name: MILKY_ACCESS_TOKEN
    description: >-
      Milky access token；请通过安全凭证存储或运行时环境注入，仅用于
      `Authorization: Bearer <token>`，不会写入日志、错误或发送结果。
    prompt: Milky access token
    password: true

optional_env:
  - name: MILKY_ALLOWED_CHATS
    description: >-
      可选的入站 chat key 白名单，逗号分隔完整的 `group:<十进制群号>` 或
      `dm:<十进制 QQ 号>`。留空表示不因该白名单拒绝 friend/group 消息；仅控制
      入站 Gate，不影响系统消息或 cron 的 home channel。
    prompt: 入站 chat 白名单
    password: false
  - name: MILKY_WILL_POLICY
    description: |-
      可选的 JSON Will policy，决定 Gate 通过后的消息等待（`wait`）或触发
      （`trigger`）。顶层支持 `engine`、`routing`、`willingness` 和 `priority`；
      `engine` 可选 `routing` 或 `willingness`。

      `routing` 支持 `direct`、`mention`、`mentionAll`、`quote`、`poke`、`allMessage`
      和 `keywords`；动作值为 `wait` 或 `trigger`，命中关键词时确定性触发。
      `willingness` 使用独立的分数、衰减、概率、增益、时间窗口和 force
      字段。下面是包含全部字段和默认值的完整示例：

      {
        "engine": "routing",
        "routing": {
          "direct": "trigger",
          "mention": "trigger",
          "mentionAll": "wait",
          "quote": "wait",
          "poke": "wait",
          "allMessage": "wait",
          "keywords": []
        },
        "willingness": {
          "maxScore": 100,
          "initialScore": 0,
          "decayHalfLifeSeconds": 600,
          "probabilityThreshold": 55,
          "probabilityAmplifier": 0.04,
          "replyCost": 35,
          "textGain": 12,
          "mentionGain": 100,
          "quoteGain": 15,
          "directGain": 40,
          "imageGain": 8,
          "pokeGain": 80,
          "keywords": [],
          "keywordMultiplier": 1.2,
          "defaultMultiplier": 1,
          "hotWindowSeconds": 15,
          "warmWindowSeconds": 60,
          "hotDecayWeight": 0.3,
          "warmDecayWeight": 0.7,
          "mentionForce": false,
          "quoteForce": false,
          "directForce": false
        },
        "priority": 1000
      }

    prompt: Milky Will 策略
    password: false
  - name: MILKY_SESSION_BUFFER_SIZE
    description: >-
      插件侧 Will wait 历史消息缓冲上限，默认 `20`；设为 `0` 禁用历史缓冲。
      它独立于 Hermes session context 和 Agent 队列。
    prompt: Will 历史缓冲上限
    password: false
  - name: MILKY_HOME_CHANNEL
    description: >-
      可选的 Hermes 系统消息和 cron 默认目标，只接受完整的
      `group:<十进制群号>` 或 `dm:<十进制 QQ 号>` chat key。它不参与入站
      allowlist；未配置时不创建隐式目标，cron 显式目标优先。
    prompt: 系统和 cron 默认目标
    password: false
  - name: MILKY_MAX_LOCAL_MEDIA_BYTES
    description: >-
      可选的出站本地资源原始字节数上限，默认 `33554432`（`32 MiB`），只接受
      `8388608`（`8 MiB`）至 `33554432`（`32 MiB`）的十进制整数。仅约束 plugin
      读取的本地路径和 `file://localhost`；`http(s)://` 与显式 `base64://` 原样传递，
      Base64 会产生约 `4/3` 的编码放大，内网部署也不消除 Milky 或下游服务端限制。
    prompt: 出站本地资源大小上限（字节）
    password: false
