name: hermes-plugin-milky
label: Milky QQ
kind: platform
version: 2.0.0
manifest_version: 2
python_dependencies:
  - "httpx>=0.27,<1"
  - "Pillow>=12.3.0"
  - "jieba>=0.42.1"
description: >-
  Hermes platform plugin for Milky QQ over HTTP Action and SSE; supports friend/group messages,
  text, CQ-compatible mentions/replies, native media, file uploads, QQ Action tools, and
  manual sticker maintenance with bounded sticker search and optional sticker sending.
author: ByteColtX
provides_tools:
  - send_profile_like
  - send_friend_nudge
  - send_group_nudge
  - recall_group_message
  - get_group_info
  - get_group_member_list
  - get_group_member_info
  - set_group_member_mute
  - set_group_whole_mute
  - get_forwarded_messages
  - get_private_file_download_url
  - kick_group_member
  - quit_group
  - delete_friend
  - get_friend_requests
  - accept_friend_request
  - reject_friend_request
  - get_group_file_download_url
  - accept_group_request
  - reject_group_request
  - accept_group_invitation
  - reject_group_invitation
  - get_group_files
  - get_friend_info
  - set_group_member_special_title
  - sticker_send
  - sticker_search
requires_env:
  - name: MILKY_ACCESS_TOKEN
    description: "Milky access token"
    prompt: Milky access token
    password: true

optional_env:
  - name: MILKY_BASE_URL
    description: "Milky HTTP(S) base URL, e.g. http://127.0.0.1:3000"
    prompt: Milky 服务地址
    password: false
  - name: MILKY_ALLOWED_CHATS
    description: "Optional inbound chat whitelist, e.g. group:123456789,dm:987654321; empty denies all ordinary inbound chats; use group:* and dm:* to allow all"
    prompt: 入站 chat 白名单
    password: false
  - name: MILKY_WILL_POLICY
    description: "Optional JSON Will policy; supports routing and willingness engines"
    prompt: Milky Will 策略
    password: false
  - name: MILKY_SESSION_BUFFER_SIZE
    description: "Inbound wait history limit; default 20, 0 disables buffering"
    prompt: Will 历史缓冲上限
    password: false
  - name: MILKY_HOME_CHANNEL
    description: "Default system/cron target, e.g. group:123456789 or dm:987654321"
    prompt: 系统和 cron 默认目标
    password: false
  - name: MILKY_MAX_LOCAL_MEDIA_BYTES
    description: "Outbound local media limit in bytes; default 33554432, range 8388608..33554432"
    prompt: 出站本地资源大小上限（字节）
    password: false
  - name: MILKY_LONG_TEXT_FORWARD_THRESHOLD
    description: "Long-text forward threshold; default 0 (disabled), range 0..4096"
    prompt: 超长文本合并转发阈值（字符）
    password: false
  - name: MILKY_GROUP_MEMBER_EVENT_NOTIFICATIONS
    description: "Enable immediate group member event notifications; default false"
    prompt: 群成员事件即时通知
    password: false

config_schema:
  base_url:
    type: string
    required: true
    label: Milky 连接地址
  access_token:
    type: secret
    env: MILKY_ACCESS_TOKEN
    label: Milky access token
  allowed_chats:
    type: array
    default: []
    label: 入站白名单（空列表阻止全部普通入站）
  will_policy:
    type: object
    default: {}
    label: Will 策略
  session_buffer_size:
    type: integer
    default: 20
  home_channel:
    type: string
    default: ""
  max_local_media_bytes:
    type: integer
    default: 33554432
  long_text_forward_threshold:
    type: integer
    default: 0
  group_member_event_notifications:
    type: boolean
    default: false
