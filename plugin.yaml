name: hermes-plugin-milky
label: qq
kind: platform
version: 0.1.0
description: Hermes 的 Milky QQ 平台适配器；媒体安全下载由 Hermes 管理
author: ByteColtX
requires_env:
  - name: MILKY_BASE_URL
    description: "Milky HTTP base URL, e.g. http://127.0.0.1:3000; the event SSE endpoint is derived by the protocol layer"
    prompt: "Milky HTTP base URL"
    password: false
  - name: MILKY_ACCESS_TOKEN
    description: "Milky access token"
    prompt: "Milky access token"
    password: true

optional_env:
  - name: MILKY_ALLOWED_CHATS
    description: "Optional comma-separated chat whitelist, e.g. group:123456789,dm:987654321; empty means allow all"
    prompt: "Milky allowed chats"
    password: false
  - name: MILKY_WILL_POLICY
    description: 'Optional nested YesImBot-inspired JSON Will policy, e.g. {"engine":"routing","routing":{"direct":"trigger","mention":"trigger","mentionAll":"wait","mentionHere":"wait","quote":"wait","image":"wait","poke":"wait","group":"wait"},"willingness":{"maxScore":100,"initialScore":0,"decayHalfLifeSeconds":600,"probabilityThreshold":55,"probabilityAmplifier":0.04,"replyCost":35,"textGain":12,"mentionGain":100,"quoteGain":15,"directGain":40,"imageGain":8,"pokeGain":80,"keywords":[],"keywordMultiplier":1.2,"defaultMultiplier":1,"hotWindowSeconds":15,"warmWindowSeconds":60,"hotDecayWeight":0.3,"warmDecayWeight":0.7,"mentionForce":false,"quoteForce":false,"directForce":false},"priority":1000}'
    prompt: "Milky Will policy"
    password: false
  - name: MILKY_SESSION_BUFFER_SIZE
    description: "Optional plugin-side pending-message buffer size for Will wait messages, default 20; this is not the Hermes session context"
    prompt: "Milky session buffer size"
    password: false
